name: Platform Policy Gate

on:
  pull_request:
    paths:
      - '3-tenant-workloads/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-tenancy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        run: |
          curl -sL "https://github.com/kyverno/kyverno/releases/download/v1.11.4/kyverno-cli_v1.11.4_linux_x86_64.tar.gz" | tar xz
          sudo mv kyverno /usr/local/bin/

      - name: Run Kyverno Policies
        run: |
          # Find all YAML files in gitops directories, excluding values.yaml
          RESOURCES=$(find 3-tenant-workloads/*/gitops -type f -name '*.yaml' ! -name 'values.yaml' | sed 's/^/--resource /')
          
          if [ -z "$RESOURCES" ]; then
            echo "No resources found to validate."
            exit 0
          fi
          
          # Run kyverno apply
          # Using set -e ensures that if kyverno fails, the script exits immediately with an error
          set -e
          # We don't quote $RESOURCES so it expands into multiple arguments
          kyverno apply 4-platform-engineering/2-cluster-services/security-governance/ $RESOURCES --policy-report
