# Platform defaults for the golden-path service chart.
#
# Anything app-specific (image.repository, nameOverride, hosts) is deliberately
# left empty here and supplied by the per-env values.yaml that `add-service`
# scaffolds into <team>/gitops/apps/<app>/<env>/. Keep this file to values that
# are genuinely the same for every service on the platform.

replicaCount: 1

image:
  # Set per app in the release values. Empty here so a missing override fails
  # loudly at render time instead of silently deploying someone else's image.
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

# Set to the app name by the release values so resource names come out as
# "<app>" rather than "<app>-service". See the app.fullname helper.
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Secure-by-default: non-root, no privilege escalation, read-only root filesystem.
# This is the kind of thing that belongs in the platform chart rather than in each
# team's values — it is a guardrail, not a preference.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 20
  targetCPUUtilizationPercentage: 80

# Progressive delivery via Argo Rollouts (installed as a cluster addon —
# see 4-platform-engineering/addons/gitops-orchestration/argo-rollouts.yaml).
# Off by default: a plain Deployment is the right choice until a team asks
# for canary control. When enabled, rollout.yaml renders an
# argoproj.io/v1alpha1 Rollout instead of deployment.yaml's Deployment —
# never both, since they'd fight over the same pod selector.
rollout:
  enabled: false
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 60 }
      - setWeight: 50
      - pause: { duration: 60 }
      - setWeight: 100

nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  annotations: {}
  hosts: []
