# 1-platform-catalog/catalog.yaml
# This file defines the platform's offering (Golden Paths, Capabilities)
# and its output contract (Destinations)

# The base URL for all Terraform modules
capabilities_source_base: "git::https://github.com/ok-karthik/platform-engineering-idp-gitops-reference-architecture.git//4-platform-engineering/cloud-services-terraform-modules"

# Golden Paths define secure-by-default microservice scaffolds
# Schema uses a list so it maps correctly to the Go struct `[]GoldenPath`
golden-paths:
  - name: go-service-postgres
    description: Go microservice backed by AWS Postgres, shipped via ArgoCD
    runtime: go
    capabilities: [postgres]
    delivery: standard-helm
  - name: python-worker-s3
    description: Python worker with an S3 bucket
    runtime: python
    capabilities: [s3]
    delivery: standard-helm

# Capabilities map a friendly name to a version-pinned Terraform module
capabilities:
  postgres:
    module: aws-postgres
    version: v1.0.2
  s3:
    module: aws-s3
    version: v1.0.2
  iam:
    module: aws-iam
    version: v1.0.2

# The Output Contract: Where each component gets written.
# This eliminates hardcoded paths in the Go CLI.
#
# Every key is the LITERAL source directory inside this catalog, so the renderer
# can derive the source path from the key instead of hardcoding both sides.
#
# Layout is tenant-first: 3-tenant-workloads/{team}/{apps,infra,gitops}/.
# Each of those three subdirectories maps 1:1 to a standalone repo in production
# (<org>/{team}-apps, <org>/{team}-infra, <org>/{team}-gitops) — the mapping lives
# here in docs rather than being encoded in the directory name.
#
# "apps" is the one word used throughout for team-owned, per-service content; what
# it holds depends on which repo kind it sits in:
#   {team}/apps/...          -> application source code
#   {team}/infra/apps/...    -> that app's Terraform
#   {team}/gitops/apps/...   -> that app's Helm values
#
# Inside infra/ and gitops/ the split is by OWNERSHIP, not taxonomy:
#   platform/  -> platform team owns it (CODEOWNERS-protected)
#   apps/      -> the team owns it
# so the ownership rule is a single glob:
#   {team}/gitops/platform/**  and  {team}/infra/platform/**  -> platform team
#   everything else                                          -> the owning team
#
# There is deliberately NO {system} directory level. Backstage models System as a
# metadata relation, not a location, so the grouping lives in catalog-info.yaml
# (`spec.system`) where it cannot drift from a second encoding in the path. Add a
# grouping level here only if a single team outgrows a flat app list.
destinations:
  # One key per repo kind, mapping a blueprint directory to a would-be repo ROOT.
  # blueprints/team/<kind>/ mirrors the tree it produces exactly — so the nesting
  # inside each blueprint (platform/team/, platform/applicationsets/) is the whole
  # path logic. Nothing needs a per-file rule, which is what lets CODEOWNERS sit at
  # the repo root where GitHub actually honours it.
  #
  # These three paths are also exactly the `git subtree split` prefixes, which is
  # what makes splitting into real repos a no-op rather than a reshuffle.
  blueprints/team/apps:   "{team}/apps/"
  blueprints/team/infra:  "{team}/infra/"
  blueprints/team/gitops: "{team}/gitops/"

  building-blocks/runtimes:         "{team}/apps/{app}/"
  building-blocks/service-meta:     "{team}/apps/{app}/"
  building-blocks/capabilities:     "{team}/infra/apps/{app}/{env}/"
  building-blocks/delivery/release: "{team}/gitops/apps/{app}/{env}/"
