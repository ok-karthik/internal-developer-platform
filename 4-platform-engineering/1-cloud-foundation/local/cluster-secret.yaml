# Registers the local cluster with ArgoCD as a labelled cluster (PLAN.md Phase 18.2).
# Tenant ApplicationSets pick clusters by label — `environment` must equal the env
# directory of the app (dev, prod, ...) — so an unlabelled cluster receives nothing.
# k3d is the dev environment, which is why only `dev` apps deploy here and `prod` waits
# for a cluster labelled environment=prod (the gated promotion of ADR 0003).
#
# A real fleet cluster is registered the same way by the cloud-foundation stack that
# creates it, with its own server URL, credentials in `config`, and these three labels.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-local
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    environment: dev
    region: local
    tier: general
type: Opaque
stringData:
  name: local
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig": {"insecure": false}}
