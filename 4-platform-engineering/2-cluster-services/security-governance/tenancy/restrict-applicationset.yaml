apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-applicationset
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    # A tenant's git generator may be top-level or inside a matrix (the scaffolded
    # ApplicationSet pairs it with a cluster generator, PLAN.md Phase 18.2). Both shapes
    # are checked, path by path. The `foreach` lists are empty when a shape is absent,
    # so a tenant cannot dodge the rule by picking the other one.
    #
    # Kyverno's `*` matches across `/`, so the prefix below alone would accept
    # "3-tenant-repos/<tenant>/gitops-repo/../../<other-tenant>/gitops-repo/*" — hence the
    # separate deny-path-traversal rule.
    - name: restrict-applicationset
      match:
        any:
        - resources:
            kinds:
              - ApplicationSet
      validate:
        message: "ApplicationSet git generator directories must stay under the tenant's own gitops-repo."
        foreach:
          - list: "request.object.spec.generators[].git.directories[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.path }}"
                    operator: NotEquals
                    value: "3-tenant-repos/{{ request.object.metadata.name }}/gitops-repo/*"
          - list: "request.object.spec.generators[].matrix.generators[].git.directories[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.path }}"
                    operator: NotEquals
                    value: "3-tenant-repos/{{ request.object.metadata.name }}/gitops-repo/*"
    - name: deny-path-traversal
      match:
        any:
        - resources:
            kinds:
              - ApplicationSet
      validate:
        message: "ApplicationSet git generator directories must not contain '..'."
        foreach:
          - list: "request.object.spec.generators[].git.directories[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.path }}"
                    operator: Equals
                    value: "*..*"
          - list: "request.object.spec.generators[].matrix.generators[].git.directories[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.path }}"
                    operator: Equals
                    value: "*..*"
