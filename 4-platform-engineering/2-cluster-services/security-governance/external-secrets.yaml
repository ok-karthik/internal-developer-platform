# Phase 7.7: External Secrets Operator, alongside sealed-secrets.yaml rather
# than replacing it. Both stay because they trade off differently, not
# because one is obviously better:
#
# Sealed Secrets keeps ciphertext IN git — auditable in the same PR review as
# everything else, works fully offline, rotation is a re-seal-and-commit.
# ESO keeps only a REFERENCE in git and resolves the real value from AWS
# Secrets Manager at sync time — rotation is free (Secrets Manager rotates,
# the cluster picks it up on the next refresh, no commit needed), but the
# cluster now has a hard runtime dependency on AWS being reachable, which
# Sealed Secrets never has.
#
# ESO belongs in Phase 7 specifically because it authenticates to AWS via
# IRSA (../../1-cloud-foundation/aws/workload-identity/irsa.tf) or Pod
# Identity — the workload-identity plane from the Four Planes table in
# .agents/AGENTS.md. The ClusterSecretStore below is scoped per-namespace to
# that team's own role, so the tenancy boundary extends to secrets with no
# new machinery beyond what Phase 3.5/5.2/7.2c already built.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://charts.external-secrets.io'
    targetRevision: '0.10.7'
    chart: external-secrets
    helm:
      parameters:
        - name: "installCRDs"
          value: "true"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
