# Phase 7.1: Keycloak as the platform's IdP. A self-hosted STAND-IN for a
# corporate IdP (Entra ID / Okta / Google Workspace) plus AWS IAM Identity
# Center — chosen so the whole identity loop runs locally with no corporate
# tenant. Do not read this as "deploy Keycloak at an AWS shop that already
# has Identity Center" — see README.md's Phase 7 section for the real chain
# this substitutes for.
#
# Client secrets: the four clients in realm-config.yaml are declared without
# secrets embedded here. In a real deployment those are generated by
# Keycloak on first import and belong in Vault/ESO (Phase 7.7), never in
# git — this demo accepts Keycloak's auto-generated secrets and reads them
# out of the cluster (`kubectl get secret`) rather than pretending a
# git-committed secret would be acceptable practice.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: '24.2.4'
    chart: keycloak
    helm:
      values: |
        auth:
          adminUser: admin
          # Demo-only: a fixed admin password so `make bootstrap` is
          # reproducible without a manual secret step. Phase 7.7 (External
          # Secrets Operator) is the honest answer for anything beyond a
          # local demo — this is the same tradeoff sealed-secrets.yaml
          # documents for its own controller.
          adminPassword: "admin-changeme"
        extraVolumes:
          - name: realm-config
            configMap:
              name: keycloak-realm-config
        extraVolumeMounts:
          - name: realm-config
            mountPath: /opt/bitnami/keycloak/data/import
        extraStartupArgs: "--import-realm"
        proxy: edge
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: traefik
  rules:
    - host: keycloak.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
