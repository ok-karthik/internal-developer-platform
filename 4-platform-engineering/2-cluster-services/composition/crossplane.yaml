# Phase 9: Crossplane, restored from git history (`git log -- archived/crossplane/`)
# and modernized to v2. Picked over kro per PLAN.md Phase 9's tiebreak:
# margin is thin (Crossplane graduated CNCF Oct 2025, kro is still not GA),
# but the decisive reason is Phase 10.1 — ACK is AWS-only and kro needs ACK
# underneath it for anything AWS, so kro keeps this platform cloud-locked.
# Crossplane has providers for AWS, Azure and GCP, so it is the only Phase 9
# choice that does not undercut the Phase 10 portability seam.
#
# Modernized from the archived Helm-templated version
# ({{- if .Values.components.crossplane.enabled }} conditionals from a prior
# addon-delivery mechanism) to a plain ArgoCD Application, matching every
# other file in this directory — this repo has no "enabled" toggle pattern
# for addons; a file existing IS the toggle.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://charts.crossplane.io/stable'
    targetRevision: '2.2.0'
    chart: crossplane
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.3.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-s3
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/upbound/provider-aws-s3:v2.5.2
  runtimeConfigRef:
    name: high-memory-config
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: high-memory-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
---
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: creds
---
# The XRD and Composition live in 4-platform-apis/ (per PLAN.md Phase 3.8's
# tree — "the custom APIs tenants call"), NOT under 2-cluster-services/
# itself, so this Application's source.path points there instead of using
# bootstrap.yaml's recurse. Wave 2: needs the Crossplane core CRDs (wave 0)
# and function-patch-and-transform (wave 1) to already exist, or the XRD's
# own CRD registration and the Composition's functionRef both fail.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/ok-karthik/internal-developer-platform.git'
    targetRevision: HEAD
    path: 4-platform-engineering/4-platform-apis
    directory:
      include: "*.yaml"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
