apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-systems-bootstrap
  namespace: argocd
  annotations:
    description: "Cluster-wide bootstrap: Discovers per-tenant/per-system AppSets and applies them."
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - git:
        repoURL: 'https://github.com/ok-karthik/internal-developer-platform.git'
        revision: HEAD
        directories:
          # Each tenant keeps all of its platform-owned system ApplicationSets in one
          # directory, so this yields one Application per tenant that applies them all.
          # For 3-tenant-repos/tenant-a/gitops-repo/platform/applicationsets the segments
          # are 0=3-tenant-repos 1=tenant-a 2=gitops-repo 3=platform 4=applicationsets.
          - path: 3-tenant-repos/*/gitops-repo/platform/applicationsets
  template:
    metadata:
      name: '{{path[1]}}-appsets'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/ok-karthik/internal-developer-platform.git'
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
