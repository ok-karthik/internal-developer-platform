apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: platform-autoinstrumentation
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  exporter:
    # Send telemetry to the platform OTLP collector (ADR 0014)
    endpoint: http://platform-otlp-collector.monitoring.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_always_on
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:latest
    env:
      - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
        value: "system_metrics"
      - name: OTEL_LOGS_EXPORTER
        value: "none"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://platform-otlp-collector.monitoring.svc.cluster.local:4318"
      - name: OTEL_SEMCONV_STABILITY_OPT_IN
        value: "http"
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:latest
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://platform-otlp-collector.monitoring.svc.cluster.local:4318"
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:latest
