# A local stand-in receiver for Alertmanager's page/ticket routes
# (prometheus.yaml's alertmanager.config). It just echoes whatever POST it
# gets back into its own logs — enough to prove the routing tree actually
# delivers to the right receiver, without needing a real PagerDuty/Slack
# account. Swap the two webhook_configs URLs in prometheus.yaml for real
# integrations when this stops being a demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook-receiver
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: alert-webhook-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook-receiver
  template:
    metadata:
      labels:
        app: alert-webhook-receiver
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:31
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook-receiver
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: alert-webhook-receiver
spec:
  selector:
    app: alert-webhook-receiver
  ports:
    - port: 8080
      targetPort: 8080
      name: http
