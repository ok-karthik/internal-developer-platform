apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-systems-bootstrap
  namespace: argocd
  annotations:
    description: "Cluster-wide bootstrap: Discovers per-team/per-system AppSets and applies them."
spec:
  generators:
    - git:
        repoURL: 'https://github.com/ok-karthik/platform-engineering-idp-gitops-reference-architecture.git'
        revision: HEAD
        directories:
          # Each team keeps all of its platform-owned system ApplicationSets in one
          # directory, so this yields one Application per team that applies them all.
          # For 3-tenant-workloads/team-a/gitops/platform/applicationsets the segments
          # are 0=3-tenant-workloads 1=team-a 2=gitops 3=platform 4=applicationsets.
          - path: 3-tenant-workloads/*/gitops/platform/applicationsets
  template:
    metadata:
      name: '{{path[1]}}-appsets'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/ok-karthik/platform-engineering-idp-gitops-reference-architecture.git'
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
