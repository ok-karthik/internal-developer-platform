apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-a
  namespace: argocd
spec:
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Template/#go-templating
  goTemplate: true
  generators:
    - git:
        repoURL: 'https://github.com/ok-karthik/internal-developer-platform.git'
        revision: HEAD
        directories:
          # app x env — one Application per environment of every service this tenant owns.
          - path: 3-tenant-repos/tenant-a/gitops-repo/services/*/*
  template:
    metadata:
      # For path 3-tenant-repos/tenant-a/gitops-repo/services/app-a/dev the segments are
      # 0=3-tenant-repos 1=tenant-a 2=gitops-repo 3=services 4=app-a 5=dev — so segment 4
      # is the app and basename is the env.
      name: 'tenant-a-{{ index .path.segments 4 }}-{{ .path.basename }}'
    spec:
      project: tenant-a
      source:
        repoURL: 'https://github.com/ok-karthik/internal-developer-platform.git'
        targetRevision: HEAD
        path: '{{ .path.path }}/manifests'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: 'tenant-a'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
