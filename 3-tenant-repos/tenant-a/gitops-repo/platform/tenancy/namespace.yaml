apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    team: tenant-a
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-a-quota
  namespace: tenant-a
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "50"
    count/services.loadbalancers: "2"    # each = a real ELB = a real bill
    count/services.nodeports: "0"        # forces traffic through the ingress
    persistentvolumeclaims: "10"
    requests.storage: 100Gi
    count/secrets: "100"                 # etcd pressure
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-a-limits
  namespace: tenant-a
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "10m"
        memory: "32Mi"
      maxLimitRequestRatio:
        cpu: "4"   # limits overcommit gaming
