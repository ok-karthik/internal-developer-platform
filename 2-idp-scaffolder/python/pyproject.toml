[project]
name = "idp-scaffolder-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.0",
    "fastapi[standard]>=0.136.3",
    "pydantic>=2.13.4",
    "typer>=0.26.7",
]


[project.scripts]
scaffolder = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py", "cli.py", "schemas.py", "utils.py"]
